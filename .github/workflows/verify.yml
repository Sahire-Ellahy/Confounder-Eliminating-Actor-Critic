name: Verify CEAC and walkthrough
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[notebook]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests/ceac -v
      - run: python -m unittest discover -s tests/walkthrough -v
      - run: python scripts/verify_notebook.py
