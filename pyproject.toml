[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceac-benchmarks"
version = "0.1.0"
description = "Finite-model CEAC benchmarks: Undertow DeepSea and False Beacon Frozen Lake"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]
notebook = ["matplotlib>=3.7", "ipykernel>=6.25", "nbformat>=5.9", "nbclient>=0.9", "jupyterlab>=4"]
gym = ["gymnasium>=0.29"]

[project.scripts]
ceac-run = "ceac.run:main"
ceac-report = "ceac.report:main"

[tool.setuptools.packages.find]
include = ["ceac", "ceac.*", "ceac_walkthrough", "ceac_walkthrough.*", "ceac_hardness", "ceac_hardness.*", "ceac_pseudocode", "ceac_pseudocode.*", "ceac_stability", "ceac_stability.*"]
exclude = ["legacy*", "tests*", "notebooks*", "runs*"]
